<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=11" />
</head>

<body data-test="body">
  <div id="app">
    <canvas id="container" style="width: 100%"></canvas>
    <!-- <canvas  id="texture" width="1000" height="1000"></canvas> -->
  </div>
  <script src="./three.js"></script>
  <script src="./flywave.gl.js"></script>
</body>
<script>

  FlywaveGl.default.baseUrl = "./";

  var app = new FlywaveGl.Application({
    target: new FlywaveGl.GeoCoordinates(
      36.82749, 117.59765
    ),
    zoomLevel: 17,
    addBackgroundDatasource: false,
    enablePolarDataSource: false,
    lodMinTilePixelSize: 1024,
    maxVisibleDataSourceTiles: 100,
    throttlingEnabled: false,
    logarithmicDepthBuffer: true,
    canvas: document.getElementById("container")
  });

  var l = new THREE.AmbientLight();
  l.anchor = new FlywaveGl.GeoCoordinates(
    36.82749, 117.59765
  )
  app.setTinTerrainSource({
    url: `http://127.0.0.1:86/hill_tin/`
  });
  // app.setHeightMapSource("https://api.mapbox.com/v4/mapbox.terrain-rgb.json?secure&access_token=pk.eyJ1IjoiYW5pbmdnbyIsImEiOiJjbGY5Y283N3IyZjB3M3ZyMGs4emJoYWNkIn0.MRcTQs3Z9OA0EQOB40xBqQ\n")
  app.addAnchorMesh(l);
  app.addMaterialProviders(new FlywaveGl.MaterialProvider({ url: `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}` }));
</script>

</html>
