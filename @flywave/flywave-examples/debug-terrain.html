<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
        />
        <title>Terrain Tools Debug</title>
        <style>
            body {
                margin: 0;
                padding: 20px;
                font-family: monospace;
                background: #1e1e1e;
                color: #d4d4d4;
            }
            #info {
                background: #2d2d30;
                padding: 15px;
                border-radius: 5px;
                margin-bottom: 20px;
                border: 1px solid #3e3e42;
            }
            #info h2 {
                margin: 0 0 10px 0;
                color: #4ec9b0;
            }
            #info p {
                margin: 5px 0;
            }
            .status {
                color: #4ec9b0;
                font-weight: bold;
            }
            .warning {
                color: #ce9178;
            }
            #canvas-container {
                position: relative;
                width: 100%;
                height: 600px;
                background: #000;
                border-radius: 5px;
                overflow: hidden;
            }
            #mapCanvas {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="info">
            <h2>🔍 Terrain Tools Debug Mode</h2>
            <p><span class="status">状态:</span> <span id="tool-status">初始化中...</span></p>
            <p><span class="status">模式:</span> <span id="tool-mode">未知</span></p>
            <p><span class="status">操作数:</span> <span id="op-count">0</span></p>
            <p class="warning">💡 打开浏览器控制台查看详细日志</p>
        </div>
        <div id="canvas-container">
            <canvas id="mapCanvas"></canvas>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
                    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
                    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js"
                }
            }
        </script>
        <script type="module">
            import {
                MapView,
                GeoCoordinates,
                ellipsoidProjection,
                MapControls,
                MapControlsUI,
                DEMTerrainSource,
                ArcGISTileProvider,
                TerrainTools,
                TerrainControlPointUI,
                ToolMode
            } from "./flywave_gl_src_index_ts_bundle.js";

            const CONFIG = {
                DEM_SOURCE_PATH: "dem_terrain/source.json",
                INITIAL_COORDINATES: new GeoCoordinates(36.4, 118.1, 1000),
                ZOOM_LEVEL: 17
            };

            let terrainTools = null;

            function updateStatus(status) {
                document.getElementById("tool-status").textContent = status;
            }

            function updateMode(mode) {
                document.getElementById("tool-mode").textContent =
                    mode === "brush" ? "笔刷模式" : "控制点模式";
            }

            function updateOpCount(count) {
                document.getElementById("op-count").textContent = count;
            }

            async function init() {
                try {
                    console.log("🚀 开始初始化...");

                    const canvas = document.getElementById("mapCanvas");
                    console.log("✅ Canvas 找到:", canvas);

                    const mapView = new MapView({
                        target: CONFIG.INITIAL_COORDINATES,
                        zoomLevel: CONFIG.ZOOM_LEVEL,
                        projection: ellipsoidProjection,
                        canvas: canvas,
                        theme: { extends: "resources/tilezen_base.json" }
                    });
                    console.log("✅ MapView 创建成功");

                    const controls = new MapControls(mapView);
                    const ui = new MapControlsUI(controls, { zoomLevel: "input" });
                    canvas.parentElement.appendChild(ui.domElement);
                    console.log("✅ MapControls 初始化成功");

                    const demTerrain = new DEMTerrainSource({
                        source: CONFIG.DEM_SOURCE_PATH
                    });
                    demTerrain.addWebTileDataSource(
                        new ArcGISTileProvider({
                            minDataLevel: 0,
                            maxDataLevel: 18
                        })
                    );
                    mapView.setElevationSource(demTerrain);
                    console.log("✅ DEM 地形源配置成功");

                    const controlPointUI = new TerrainControlPointUI();

                    terrainTools = new TerrainTools({
                        mapView: mapView,
                        demTerrainSource: demTerrain,
                        showUI: true,
                        defaultBrush: {
                            type: "raise",
                            radius: 80,
                            hardness: 0.5,
                            heightDelta: 10
                        },
                        defaultMode: "brush",
                        onOperationAdded: (id, operation) => {
                            console.log("✅ 操作添加:", id);
                            updateOpCount(terrainTools.getOperationCount());
                        },
                        onOperationRemoved: id => {
                            console.log("❌ 操作移除:", id);
                            updateOpCount(terrainTools.getOperationCount());
                        },
                        onControlPointAdded: point => {
                            console.log("📍 控制点添加:", point.id);
                        },
                        onControlPointRemoved: id => {
                            console.log("🗑️ 控制点移除:", id);
                        },
                        onControlPointSelected: point => {
                            if (point) {
                                console.log("✅ 控制点选中:", point.id);
                                controlPointUI.show(point);
                            } else {
                                console.log("❌ 控制点取消选中");
                                controlPointUI.hide();
                            }
                        }
                    });

                    console.log("✅ TerrainTools 创建成功");

                    terrainTools.enable();
                    console.log("✅ 工具已启用");
                    console.log("📍 当前模式:", terrainTools.getMode());

                    updateStatus("✅ 已启用");
                    updateMode(terrainTools.getMode());

                    window.addEventListener("controlPointDelete", () => {
                        terrainTools.removeSelectedControlPoint();
                    });

                    window.addEventListener("keydown", event => {
                        if (event.key === "Delete" || event.key === "Backspace") {
                            terrainTools.removeSelectedControlPoint();
                            controlPointUI.hide();
                        } else if (event.key === "c" || event.key === "C") {
                            const newMode =
                                terrainTools.getMode() === "brush" ? "control" : "brush";
                            terrainTools.setMode(newMode);
                            console.log(
                                "🔄 切换到:",
                                newMode === "brush" ? "笔刷模式" : "控制点模式"
                            );
                            updateMode(newMode);
                        } else if (event.key === "a" || event.key === "A") {
                            terrainTools.applyControlPointsToTerrain();
                            console.log("✅ 应用所有控制点到地形");
                        }
                    });

                    canvas.addEventListener("mousedown", e => {
                        console.log("🖱️ 鼠标点击:", e.clientX, e.clientY);
                        console.log("📍 工具状态:", terrainTools.getMode());
                    });

                    setTimeout(() => {
                        console.log("=".repeat(60));
                        console.log("🎉 初始化完成！");
                        console.log("=".repeat(60));
                        console.log("✅ 地形工具已启用");
                        console.log(
                            "📍 当前模式:",
                            terrainTools.getMode() === "brush" ? "笔刷模式" : "控制点模式"
                        );
                        console.log("💡 点击地图开始操作");
                        console.log("💡 按 'C' 键切换模式");
                        console.log("=".repeat(60));
                    }, 500);
                } catch (error) {
                    console.error("❌ 初始化失败:", error);
                    updateStatus("❌ 错误: " + error.message);
                }
            }

            init();
        </script>
    </body>
</html>
