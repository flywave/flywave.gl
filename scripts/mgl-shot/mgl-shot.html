<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/mapbox-gl-js/dist/mapbox-gl.css"/>
    <script src="/mapbox-gl-js/dist/mapbox-gl.js"></script>
    <style>
        html, body { margin: 0; padding: 0; background: #ffffff; }
        #map { width: 512px; height: 512px; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // §885 终一六八 rebuild: CDP-driven vendored-mgl live capture.
    // Query: ?fixture=<family/case>[&ops=1]
    // Serves the fixture style with local:// rewritten to /integration/ —
    // the same mapping as the compat harness's localizeUrl.
    (async function () {
        const params = new URLSearchParams(location.search);
        const fixture = params.get('fixture');
        // Use the UPSTREAM integration root — it is self-contained (tiles,
        // glyphs, sprites match the fixture expectations, e.g. the NY tiles
        // for occlusion/*).
        const res = await fetch(`/mapbox-gl-js/test/integration/render-tests/${fixture}/style.json`);
        const style = await res.json();
        const INT = '/mapbox-gl-js/test/integration';
        const localize = (u) => String(u).replace(/^local:\/\//, `${INT}/`);
        if (style.glyphs) style.glyphs = localize(style.glyphs);
        if (style.sprite) style.sprite = localize(style.sprite);
        for (const [, src] of Object.entries(style.sources ?? {})) {
            if (Array.isArray(src.tiles)) src.tiles = src.tiles.map(localize);
            if (typeof src.url === 'string' && src.url.startsWith('local://')) src.url = localize(src.url);
            // model sources: the loader fetches uri directly (终二四二)
            if (src.type === 'model' && src.models) {
                for (const m of Object.values(src.models)) {
                    if (typeof m.uri === 'string' && m.uri.startsWith('local://')) m.uri = localize(m.uri);
                }
            }
        }
        const t = (style.metadata ?? {}).test ?? {};
        // §885 终二三五: light sweep override — ?laz=<azimuth>[&lpol=<polar>]
        // rewrites the first directional 3D light's direction so the live mgl
        // response curve value(azimuth) can be measured per wall family.
        {
            const laz = params.get('laz'), lpol = params.get('lpol');
            if ((laz !== null || lpol !== null) && Array.isArray(style.lights)) {
                for (const l of style.lights) {
                    if (l.type === 'directional') {
                        l.properties = l.properties ?? {};
                        const cur = Array.isArray(l.properties.direction) ? l.properties.direction : [210, 30];
                        l.properties.direction = [
                            laz !== null ? Number(laz) : Number(cur[0]),
                            lpol !== null ? Number(lpol) : Number(cur[1]),
                        ];
                    }
                }
            }
        }
        const meta = params.get('meta') ? JSON.parse(params.get('meta')) : null;
        mapboxgl.accessToken = 'pk.eyJ1IjoibG9jYWwtdGVzdCJ9.local-test-token';
        // §885 终二四二: ?zoom=/&bearing= overrides for camera semantics probes.
        const zoomOv = params.get('zoom'), bearOv = params.get('bearing');
        const map = new mapboxgl.Map({
            container: 'map',
            style,
            center: style.center,
            zoom: zoomOv !== null ? Number(zoomOv) : style.zoom,
            pitch: style.pitch ?? 0,
            bearing: bearOv !== null ? Number(bearOv) : (style.bearing ?? 0),
            pixelRatio: t.pixelRatio ?? 2,
            fadeDuration: 0,
            attributionControl: false,
            interactive: false,
        });
        window.__mbMap = map;
        const done = () => { window.__shotReady = true; };
        map.on('idle', done);
        map.on('error', (e) => { (window.__mbErrors = window.__mbErrors ?? []).push(String(e && e.error || e)); });
        // idle can fire early (style-loaded) — re-arm a settle window like
        // the harness's waitFrameReady operation.
        let frames = 0;
        map.on('render', () => { if (++frames >= 60) done(); });
        setTimeout(done, 15000);
        // §885 终二三九: ?probe=1 — after idle, dump the placed icon instances
        // (screen position + maki + occlusion state) for placement diffing.
        if (params.get('probe') === '1') {
            const dump = () => {
                try {
                    let feats = [];
                    try { feats = map.queryRenderedFeatures(undefined, { layers: ['icon-default-emission'] }); } catch (e) {}
                    if (!feats.length) {
                        try { feats = map.queryRenderedFeatures(); } catch (e2) { feats = []; }
                    }
                    window.__placedIcons = feats.map(f => {
                        const c = f.properties && f.properties.maki;
                        let px = null, py = null;
                        try {
                            const g = f.geometry && f.geometry.coordinates;
                            if (g) {
                                const pt = map.project(g);
                                px = Math.round(pt.x * 2); py = Math.round(pt.y * 2);
                            }
                        } catch (e) {}
                        const pk = f.properties ? Object.keys(f.properties).slice(0, 8) : [];
                        return { maki: c, x: px, y: py, pk };
                    });
                } catch (e) { window.__placedIcons = { err: String(e) }; }
                fetch('/__probe', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(window.__placedIcons),
                }).catch(() => {});
            };
            setTimeout(dump, 3000);
        }
    })();
</script>
</body>
</html>
